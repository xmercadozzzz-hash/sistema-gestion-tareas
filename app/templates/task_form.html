{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h3>{{ 'Editar Tarea' if task else 'Nueva Tarea' }}</h3>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="description" class="form-control" rows="3">{{ task.description if task else '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Grupo de Trabajo</label>
                        <select name="group_id" class="form-select" required>
                            <option value="">Seleccione un grupo</option>
                            {% for g in groups %}
                            <option value="{{ g.id }}" {% if task and task.group_id == g.id %}selected{% endif %}>{{ g.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Responsable</label>
                        <select name="responsible_id" class="form-select" required>
                            <option value="">Seleccione un responsable</option>
                            {% for r in responsibles %}
                            <option value="{{ r.id }}" {% if task and task.responsible_id == r.id %}selected{% endif %}>{{ r.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha Límite</label>
                        <input type="date" name="due_date" class="form-control" value="{{ task.due_date.strftime('%Y-%m-%d') if task else '' }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Prioridad</label>
                        <select name="priority" class="form-select">
                            <option value="baja" {% if task and task.priority == 'baja' %}selected{% endif %}>Baja</option>
                            <option value="media" {% if not task or task.priority == 'media' %}selected{% endif %}>Media</option>
                            <option value="alta" {% if task and task.priority == 'alta' %}selected{% endif %}>Alta</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <select name="status" class="form-select">
                            <option value="pendiente" {% if not task or task.status == 'pendiente' %}selected{% endif %}>Pendiente</option>
                            <option value="en proceso" {% if task and task.status == 'en proceso' %}selected{% endif %}>En Proceso</option>
                            <option value="completada" {% if task and task.status == 'completada' %}selected{% endif %}>Completada</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Tarea</button>
                <a href="{{ url_for('tasks.task_list') }}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
