<!-- app/templates/register.html -->
{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-3">Registro de Usuario</h3>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3"><label class="form-label">Usuario</label><input type="text" name="username" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>
            <p class="text-center mt-3"><a href="{{ url_for('auth.login') }}">¿Ya tienes cuenta? Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
