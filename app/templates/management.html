{% extends "base.html" %}
{% block content %}
<h2>Gestión de Grupos y Responsables</h2>
<div class="row mt-4">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm mb-4">
            <h4>Nuevo Grupo</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="action" value="add_group">
                <div class="mb-3"><label class="form-label">Nombre del Grupo</label><input type="text" name="group_name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Descripción</label><textarea name="group_desc" class="form-control"></textarea></div>
                <button type="submit" class="btn btn-primary">Crear Grupo</button>
            </form>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h4>Nuevo Responsable</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="action" value="add_responsible">
                <div class="mb-3"><label class="form-label">Nombre</label><input type="text" name="resp_name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="resp_email" class="form-control" required></div>
                <div class="mb-3">
                    <label class="form-label">Grupo</label>
                    <select name="resp_group" class="form-select" required>
                        <option value="">Seleccione grupo</option>
                        {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Registrar Responsable</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
